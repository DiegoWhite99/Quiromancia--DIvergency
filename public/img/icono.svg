<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Quiromancia AI">
  <!-- Icono de la app: bola de cristal. Paleta de Divergency (navy + oro). -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2121DE"/>
      <stop offset="1" stop-color="#0D0D6B"/>
    </linearGradient>
    <radialGradient id="bola" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#3B3BA8"/>
      <stop offset="55%" stop-color="#141452"/>
      <stop offset="100%" stop-color="#07072C"/>
    </radialGradient>
    <linearGradient id="peana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9C8E8"/>
    </linearGradient>
    <linearGradient id="aro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE9B5"/>
      <stop offset="50%" stop-color="#C8902F"/>
      <stop offset="100%" stop-color="#FBE9B5"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" rx="40" fill="url(#fondo)"/>

  <!-- Peana -->
  <path d="M60 150h60l-9-19H69z" fill="url(#peana)"/>
  <rect x="54" y="148" width="72" height="9" rx="4.5" fill="url(#peana)"/>

  <!-- Esfera -->
  <circle cx="90" cy="84" r="47" fill="url(#bola)" stroke="url(#aro)" stroke-width="4.5"/>
  <!-- Brillo del cristal -->
  <ellipse cx="72" cy="64" rx="17" ry="11" fill="#FFFFFF" opacity=".17" transform="rotate(-32 72 64)"/>

  <!-- Destellos dentro de la bola -->
  <path d="M92 56c2.6 11.6 5.8 14.8 17.4 17.4C97.8 76 94.6 79.2 92 90.8 89.4 79.2 86.2 76 74.6 73.4 86.2 70.8 89.4 67.6 92 56z" fill="#F2D399"/>
  <path d="M72 88c1.5 6.8 3.4 8.7 10.2 10.2C75.4 99.7 73.5 101.6 72 108.4 70.5 101.6 68.6 99.7 61.8 98.2 68.6 96.7 70.5 94.8 72 88z" fill="#EBC878" opacity=".92"/>
  <circle cx="110" cy="99" r="4" fill="#F2D399" opacity=".85"/>
  <circle cx="76" cy="52" r="2.6" fill="#FBE9B5" opacity=".7"/>
</svg>
